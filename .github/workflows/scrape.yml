name: Scrape

on:
  schedule:
    # Every 6 hours (02:00 / 08:00 / 14:00 / 20:00 UTC). Catches venue additions
    # that get announced on social and can sell out fast. Each run deploys only if
    # screenings.json actually changed, so empty runs cost nothing.
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:       # also allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40      # backstop; per-venue caps in scrape_all should fire first
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install flask requests beautifulsoup4 playwright upstash-redis
          playwright install chromium --with-deps

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated screenings
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenings.json *_meta_cache.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit/deploy."
          else
            git commit -m "chore: scrape $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

name: Daily Scrape

on:
  schedule:
    - cron: '0 14 * * *'  # 7am PT (UTC-7) every day
  workflow_dispatch:       # also allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install flask requests beautifulsoup4 playwright upstash-redis
          playwright install chromium --with-deps

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated screenings
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenings.json
          git diff --cached --quiet || git commit -m "chore: daily scrape $(date -u +%Y-%m-%d)"
          git push

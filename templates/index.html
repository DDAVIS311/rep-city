<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rep City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #333;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #c8a04a;

    --newbev: #e05c3a;
    --vista: #6b9fc8;
    --vidiots: #7ac87a;
    --braindead: #b07ae8;
    --academy: #e87a9e;
    --aero: #e8c84a;
    --egyptian: #c8874a;
    --losfeliz: #4ac8c8;
    --dirsvillage: #a8c84a;

    /* NYC venues */
    --ifc: #e84a4a;
    --filmforum: #e8824a;
    --anthology: #e8b84a;
    --lowcinema: #c84ae8;
    --metrograph: #4a82e8;
    --filmlinc: #4ae8c8;
    --moma: #e8e8e8;
    --momi: #8a4ae8;

    --want-bg: #1a2e1a;
    --want-border: #4a8a4a;
    --dismissed-opacity: 0.22;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }

  /* ── Header ── */
  header {
    background: #0f0b08;
    border-bottom: 1px solid #2a1f14;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  /* ── Rep City marquee logo ── */
  .rc-logo {
    --rc-bg:     #1a130d;
    --rc-frame:  #f0b54a;
    --rc-text:   #fbecce;
    --rc-accent: #e7493b;
    --rc-sub:    #caa46b;
    --rc-bulb:   #ffe39e;

    display: inline-block;
    background: var(--rc-bg);
    border: 2px solid var(--rc-frame);
    border-radius: 6px;
    padding: 8px 16px 7px;
    box-shadow: 0 0 0 4px var(--rc-bg), 0 0 24px rgba(240,181,74,.3);
    font-family: 'Space Grotesk', sans-serif;
    flex-shrink: 0;
  }
  .rc-bulbs { display: flex; justify-content: space-between; }
  .rc-bulbs--top    { margin-bottom: 6px; }
  .rc-bulbs--bottom { margin-top: 6px; }
  .rc-bulb {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--rc-bulb);
    box-shadow: 0 0 5px 1px rgba(255,200,90,.85);
    animation: rc-pulse 2.6s ease-in-out infinite;
  }
  .rc-bulb:nth-child(2n) { animation-delay: .6s; }
  .rc-bulb:nth-child(3n) { animation-delay: 1.2s; }
  .rc-bulb:nth-child(4n) { animation-delay: 1.8s; }
  @keyframes rc-pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: .45; }
  }
  .rc-center    { text-align: center; }
  .rc-kicker    {
    font-size: 7px; font-weight: 700;
    letter-spacing: .45em; text-indent: .45em;
    color: var(--rc-accent);
  }
  .rc-wordmark  {
    font-family: 'Staatliches', sans-serif;
    font-size: 38px; line-height: .88;
    letter-spacing: .02em;
    color: var(--rc-text);
    text-shadow: 0 0 12px rgba(240,181,74,.5);
  }
  .rc-tagline   {
    font-size: 6.5px; letter-spacing: .3em;
    color: var(--rc-sub); margin-top: 3px;
  }
  @media (prefers-reduced-motion: reduce) { .rc-bulb { animation: none; } }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1;
  }

  /* ── Filter buttons ── */
  .filter-group {
    display: flex;
    gap: 4px;
  }

  .filter-btn {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    transition: all .15s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

  /* ── Venue filter pills ── */
  .venue-filters {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .venue-pill {
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid;
    background: transparent;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    transition: all .15s;
    opacity: .5;
  }
  .venue-pill.active { opacity: 1; }
  .venue-pill[data-venue="IFC"]         { color: var(--ifc);         border-color: var(--ifc); }
  .venue-pill[data-venue="FilmForum"]  { color: var(--filmforum);   border-color: var(--filmforum); }
  .venue-pill[data-venue="Anthology"]  { color: var(--anthology);   border-color: var(--anthology); }
  .venue-pill[data-venue="LowCinema"] { color: var(--lowcinema);   border-color: var(--lowcinema); }
  .venue-pill[data-venue="Metrograph"] { color: var(--metrograph);  border-color: var(--metrograph); }
  .venue-pill[data-venue="FilmLinc"]   { color: var(--filmlinc);    border-color: var(--filmlinc); }
  .venue-pill[data-venue="MoMA"]       { color: var(--moma);        border-color: var(--moma); }
  .venue-pill[data-venue="MoMI"]       { color: var(--momi);        border-color: var(--momi); }
  .venue-pill.active[data-venue="IFC"]         { background: var(--ifc);        color: #fff; }
  .venue-pill.active[data-venue="FilmForum"]   { background: var(--filmforum);  color: #fff; }
  .venue-pill.active[data-venue="Anthology"]   { background: var(--anthology);  color: #000; }
  .venue-pill.active[data-venue="LowCinema"]  { background: var(--lowcinema);  color: #fff; }
  .venue-pill.active[data-venue="Metrograph"]  { background: var(--metrograph); color: #fff; }
  .venue-pill.active[data-venue="FilmLinc"]    { background: var(--filmlinc);   color: #000; }
  .venue-pill.active[data-venue="MoMA"]        { background: var(--moma);       color: #000; }
  .venue-pill.active[data-venue="MoMI"]        { background: var(--momi);       color: #fff; }

  .venue-pill[data-venue="NewBev"]      { color: var(--newbev);      border-color: var(--newbev); }
  .venue-pill[data-venue="Vista"]       { color: var(--vista);       border-color: var(--vista); }
  .venue-pill[data-venue="Vidiots"]     { color: var(--vidiots);     border-color: var(--vidiots); }
  .venue-pill[data-venue="BrainDead"]   { color: var(--braindead);   border-color: var(--braindead); }
  .venue-pill[data-venue="Academy"]     { color: var(--academy);     border-color: var(--academy); }
  .venue-pill[data-venue="Aero"]        { color: var(--aero);        border-color: var(--aero); }
  .venue-pill[data-venue="Egyptian"]    { color: var(--egyptian);    border-color: var(--egyptian); }
  .venue-pill[data-venue="LosFeliz"]    { color: var(--losfeliz);    border-color: var(--losfeliz); }
  .venue-pill[data-venue="DirsVillage"] { color: var(--dirsvillage); border-color: var(--dirsvillage); }
  .venue-pill.active[data-venue="NewBev"]      { background: var(--newbev);      color: #fff; }
  .venue-pill.active[data-venue="Vista"]       { background: var(--vista);       color: #fff; }
  .venue-pill.active[data-venue="Vidiots"]     { background: var(--vidiots);     color: #000; }
  .venue-pill.active[data-venue="BrainDead"]   { background: var(--braindead);   color: #fff; }
  .venue-pill.active[data-venue="Academy"]     { background: var(--academy);     color: #fff; }
  .venue-pill.active[data-venue="Aero"]        { background: var(--aero);        color: #000; }
  .venue-pill.active[data-venue="Egyptian"]    { background: var(--egyptian);    color: #fff; }
  .venue-pill.active[data-venue="LosFeliz"]    { background: var(--losfeliz);    color: #000; }
  .venue-pill.active[data-venue="DirsVillage"] { background: var(--dirsvillage); color: #000; }

  /* ── Action buttons ── */
  .action-btn {
    padding: 5px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    transition: all .15s;
    white-space: nowrap;
  }
  .action-btn:hover { border-color: var(--accent); }
  .action-btn.loading { opacity: .5; pointer-events: none; }

  .spacer { flex: 1; }

  .status-bar {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ── Legend ── */
  .legend {
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 20px;
    font-size: 11px;
    color: var(--muted);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block;
  }

  /* ── Main layout ── */
  main {
    padding: 20px;
  }

  /* ── Date sections ── */
  .date-section {
    margin-bottom: 28px;
  }

  .date-header {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .date-count {
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0;
  }

  /* ── Screening cards ── */
  .screenings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 8px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    position: relative;
    transition: opacity .2s, border-color .15s, background .15s;
    cursor: default;
  }

  .card:hover { border-color: #555; }

  .card.status-want {
    background: var(--want-bg);
    border-color: var(--want-border);
  }

  .card.status-dismissed {
    opacity: var(--dismissed-opacity);
  }

  .card.hidden { display: none; }

  /* Venue accent bar */
  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    border-radius: 6px 0 0 6px;
  }
  .card[data-venue="IFC"]::before         { background: var(--ifc); }
  .card[data-venue="FilmForum"]::before   { background: var(--filmforum); }
  .card[data-venue="Anthology"]::before   { background: var(--anthology); }
  .card[data-venue="LowCinema"]::before  { background: var(--lowcinema); }
  .card[data-venue="Metrograph"]::before  { background: var(--metrograph); }
  .card[data-venue="FilmLinc"]::before    { background: var(--filmlinc); }
  .card[data-venue="MoMA"]::before        { background: var(--moma); }
  .card[data-venue="MoMI"]::before        { background: var(--momi); }

  .card[data-venue="NewBev"]::before      { background: var(--newbev); }
  .card[data-venue="Vista"]::before       { background: var(--vista); }
  .card[data-venue="Vidiots"]::before     { background: var(--vidiots); }
  .card[data-venue="BrainDead"]::before   { background: var(--braindead); }
  .card[data-venue="Academy"]::before     { background: var(--academy); }
  .card[data-venue="Aero"]::before        { background: var(--aero); }
  .card[data-venue="Egyptian"]::before    { background: var(--egyptian); }
  .card[data-venue="LosFeliz"]::before    { background: var(--losfeliz); }
  .card[data-venue="DirsVillage"]::before { background: var(--dirsvillage); }

  .card-title {
    font-size: 13px;
    font-weight: 600;
    padding-left: 4px;
    line-height: 1.3;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 4px;
    flex-wrap: wrap;
  }

  .card-time {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }

  .card-format {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .06em;
    padding: 1px 6px;
    border-radius: 3px;
    text-transform: uppercase;
  }
  .fmt-35mm    { background: #3a2a1a; color: #e8a04a; border: 1px solid #6a4a2a; }
  .fmt-70mm    { background: #1a2a3a; color: #4ac8e8; border: 1px solid #2a5a7a; }
  .fmt-16mm    { background: #2a1a3a; color: #c87ae8; border: 1px solid #5a2a7a; }
  .fmt-dcp     { background: #1a2a1a; color: #7ae87a; border: 1px solid #2a5a2a; }
  .fmt-digital { background: #1a2a1a; color: #7ae87a; border: 1px solid #2a5a2a; }
  .fmt-vhs     { background: #2a2a1a; color: #e8e84a; border: 1px solid #6a6a1a; }
  .fmt-dvd     { background: #2a2a1a; color: #e8c84a; border: 1px solid #6a5a1a; }
  .fmt-        { display: none; }

  .card-venue {
    font-size: 10px;
    color: var(--muted);
    margin-top: 1px;
    padding-left: 4px;
  }
  .card[data-venue="IFC"]         .card-venue { color: var(--ifc); }
  .card[data-venue="FilmForum"]   .card-venue { color: var(--filmforum); }
  .card[data-venue="Anthology"]   .card-venue { color: var(--anthology); }
  .card[data-venue="LowCinema"]  .card-venue { color: var(--lowcinema); }
  .card[data-venue="Metrograph"]  .card-venue { color: var(--metrograph); }
  .card[data-venue="FilmLinc"]    .card-venue { color: var(--filmlinc); }
  .card[data-venue="MoMA"]        .card-venue { color: var(--moma); }
  .card[data-venue="MoMI"]        .card-venue { color: var(--momi); }

  .card[data-venue="NewBev"]      .card-venue { color: var(--newbev); }
  .card[data-venue="Vista"]       .card-venue { color: var(--vista); }
  .card[data-venue="Vidiots"]     .card-venue { color: var(--vidiots); }
  .card[data-venue="BrainDead"]   .card-venue { color: var(--braindead); }
  .card[data-venue="Academy"]     .card-venue { color: var(--academy); }
  .card[data-venue="Aero"]        .card-venue { color: var(--aero); }
  .card[data-venue="Egyptian"]    .card-venue { color: var(--egyptian); }
  .card[data-venue="LosFeliz"]    .card-venue { color: var(--losfeliz); }
  .card[data-venue="DirsVillage"] .card-venue { color: var(--dirsvillage); }

  /* ── Card action buttons ── */
  .card-actions {
    display: flex;
    gap: 5px;
    margin-top: 3px;
    padding-left: 4px;
  }

  .btn-want, .btn-dismiss, .btn-ticket {
    border: none;
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    transition: all .12s;
  }

  .btn-want {
    background: #1e3a1e;
    color: #5ac85a;
    border: 1px solid #2a5a2a;
  }
  .btn-want:hover { background: #2a5a2a; }
  .card.status-want .btn-want {
    background: #2a6a2a;
    color: #8ae88a;
  }

  .btn-dismiss {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-dismiss:hover { background: #3a1a1a; color: #e85a5a; border-color: #6a2a2a; }
  .card.status-dismissed .btn-dismiss {
    background: #3a1a1a;
    color: #e85a5a;
    border-color: #6a2a2a;
  }

  .btn-ticket {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    text-decoration: none;
    display: inline-block;
    line-height: 1.5;
  }
  .btn-ticket:hover { color: var(--accent); border-color: var(--accent); }

  /* ── Schedule calendar modal ── */
  #schedule-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 200;
    overflow-y: auto;
    padding: 24px;
  }
  #schedule-modal.open { display: block; }

  .schedule-modal-inner {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .schedule-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .schedule-modal-header h2 {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: .08em;
  }
  .schedule-modal-header .close-panel {
    float: none;
    font-size: 20px;
  }

  /* Month nav */
  .cal-nav {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .cal-nav-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 28px; height: 28px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s;
  }
  .cal-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cal-month-label {
    font-size: 13px;
    font-weight: 600;
    min-width: 120px;
    text-align: center;
  }

  /* Calendar grid */
  .cal-body { padding: 16px 20px 20px; }

  .cal-dow-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }
  .cal-dow {
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 4px 0;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal-cell {
    min-height: 90px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px;
    vertical-align: top;
    position: relative;
  }
  .cal-cell.empty {
    background: transparent;
    border-color: transparent;
  }
  .cal-cell.today {
    border-color: var(--accent);
  }
  .cal-cell.has-events {
    border-color: #3a4a3a;
  }
  .cal-day-num {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 4px;
    line-height: 1;
  }
  .cal-cell.today .cal-day-num {
    color: var(--accent);
  }

  /* Event chips inside calendar cells */
  .cal-event {
    font-size: 10px;
    line-height: 1.3;
    padding: 3px 5px;
    border-radius: 3px;
    margin-bottom: 3px;
    cursor: default;
    position: relative;
    overflow: hidden;
  }
  .cal-event-title {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-event-meta {
    color: rgba(255,255,255,.65);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 9px;
  }
  .cal-event.conflict {
    outline: 1px solid #e87a1a;
  }

  /* Venue-colored chips */
  .cal-event[data-venue="NewBev"]      { background: #3a1e10; border-left: 3px solid var(--newbev); }
  .cal-event[data-venue="Vista"]       { background: #10243a; border-left: 3px solid var(--vista); }
  .cal-event[data-venue="Vidiots"]     { background: #10301a; border-left: 3px solid var(--vidiots); }
  .cal-event[data-venue="BrainDead"]   { background: #241040; border-left: 3px solid var(--braindead); }
  .cal-event[data-venue="Academy"]     { background: #3a1020; border-left: 3px solid var(--academy); }
  .cal-event[data-venue="Aero"]        { background: #383010; border-left: 3px solid var(--aero); }
  .cal-event[data-venue="Egyptian"]    { background: #3a2010; border-left: 3px solid var(--egyptian); }
  .cal-event[data-venue="LosFeliz"]    { background: #0a3030; border-left: 3px solid var(--losfeliz); }
  .cal-event[data-venue="DirsVillage"] { background: #283810; border-left: 3px solid var(--dirsvillage); }

  /* Conflict banner */
  .cal-conflict-note {
    background: #3a2a10;
    border: 1px solid #c87a1a;
    color: #e8a04a;
    font-size: 10px;
    padding: 3px 6px;
    border-radius: 3px;
    margin-bottom: 3px;
  }

  /* Legend row */
  .schedule-legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 20px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--muted);
  }
  .schedule-legend-item {
    display: flex; align-items: center; gap: 5px;
  }
  .schedule-legend-swatch {
    width: 10px; height: 10px; border-radius: 2px;
  }

  /* Empty schedule */
  .cal-empty-msg {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state h2 { font-size: 18px; margin-bottom: 8px; }

  /* ── Loading overlay ── */
  #loading {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 300;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    font-size: 15px;
  }
  #loading.show { display: flex; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Close panel btn */
  .close-panel {
    float: right;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
  .close-panel:hover { color: var(--text); }

  /* Search */
  .search-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    width: 160px;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="rc-logo" role="img" aria-label="Rep City">
    <div class="rc-bulbs rc-bulbs--top">
      <span class="rc-bulb"></span><span class="rc-bulb"></span><span class="rc-bulb"></span>
      <span class="rc-bulb"></span><span class="rc-bulb"></span><span class="rc-bulb"></span>
      <span class="rc-bulb"></span><span class="rc-bulb"></span><span class="rc-bulb"></span>
      <span class="rc-bulb"></span><span class="rc-bulb"></span>
    </div>
    <div class="rc-center">
      <div class="rc-kicker">NOW SHOWING</div>
      <div class="rc-wordmark">REP CITY</div>
      <div class="rc-tagline">REPERTORY · REVIVAL · 35MM</div>
    </div>
    <div class="rc-bulbs rc-bulbs--bottom">
      <span class="rc-bulb"></span><span class="rc-bulb"></span><span class="rc-bulb"></span>
      <span class="rc-bulb"></span><span class="rc-bulb"></span><span class="rc-bulb"></span>
      <span class="rc-bulb"></span><span class="rc-bulb"></span><span class="rc-bulb"></span>
      <span class="rc-bulb"></span><span class="rc-bulb"></span>
    </div>
  </div>

  <div class="header-controls">
    <div class="filter-group" id="city-filter">
      <button class="filter-btn active" data-city="all">All Cities</button>
      <button class="filter-btn" data-city="LA">Los Angeles</button>
      <button class="filter-btn" data-city="NYC">New York</button>
    </div>

    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="want">&#10003; Want to See</button>
      <button class="filter-btn" data-filter="available">Available</button>
    </div>

    <div class="venue-filters" id="venue-filters"></div>

    <input type="text" class="search-input" id="search" placeholder="Search titles...">

    <div class="spacer"></div>

    <span class="status-bar" id="status-bar">Loading...</span>

    <button class="action-btn" id="schedule-btn">&#128197; My Schedule</button>
    <button class="action-btn" id="refresh-btn">&#8635; Refresh</button>
    <button class="action-btn" id="reset-btn">Reset All</button>
  </div>
</header>

<div class="legend">
  <span class="legend-item"><span class="legend-dot" style="background:#5ac85a"></span> Want to see</span>
  <span class="legend-item"><span class="legend-dot" style="background:#e85a5a"></span> Dismissed</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--muted)"></span> Available</span>
</div>

<main id="main"></main>

<!-- Schedule calendar modal -->
<div id="schedule-modal">
  <div class="schedule-modal-inner">
    <div class="schedule-modal-header">
      <h2>&#128197; MY SCHEDULE</h2>
      <div class="cal-nav">
        <button class="cal-nav-btn" id="cal-prev">&#8249;</button>
        <span class="cal-month-label" id="cal-month-label"></span>
        <button class="cal-nav-btn" id="cal-next">&#8250;</button>
      </div>
      <button class="close-panel" id="close-panel">&#x2715;</button>
    </div>
    <div class="cal-body">
      <div class="cal-dow-row">
        <div class="cal-dow">Sun</div><div class="cal-dow">Mon</div>
        <div class="cal-dow">Tue</div><div class="cal-dow">Wed</div>
        <div class="cal-dow">Thu</div><div class="cal-dow">Fri</div>
        <div class="cal-dow">Sat</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="schedule-legend" id="schedule-legend"></div>
  </div>
</div>

<!-- Loading overlay -->
<div id="loading">
  <div class="spinner"></div>
  <span id="loading-msg">Scraping all venues… this takes ~30s</span>
</div>

<script>
// ──────────────────────────────────────────────────────────────
// State
// ──────────────────────────────────────────────────────────────
let allScreenings = [];
let activeFilter = 'all';
let activeVenues = new Set();
let activeCity = 'all';  // 'all' | 'LA' | 'NYC'
let searchQuery = '';

const VENUE_NAMES = {
  NewBev: 'New Beverly Cinema',
  Vista: 'Vista Theater',
  Vidiots: 'Vidiots Foundation',
  BrainDead: 'Brain Dead Studios',
  Academy: 'Academy Museum',
};

// ──────────────────────────────────────────────────────────────
// API helpers
// ──────────────────────────────────────────────────────────────
async function fetchScreenings() {
  const res = await fetch('/api/screenings');
  return res.json();
}

async function updateStatus(id, status) {
  await fetch('/api/state', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({id, status}),
  });
}

// ──────────────────────────────────────────────────────────────
// Format helpers
// ──────────────────────────────────────────────────────────────
function fmtClass(fmt) {
  if (!fmt) return 'fmt-';
  const f = fmt.toLowerCase().replace(/[^a-z0-9]/g,'');
  if (f.includes('35mm')) return 'fmt-35mm';
  if (f.includes('70mm')) return 'fmt-70mm';
  if (f.includes('16mm')) return 'fmt-16mm';
  if (f.includes('dcp'))  return 'fmt-dcp';
  if (f.includes('digital')) return 'fmt-digital';
  if (f.includes('vhs'))  return 'fmt-vhs';
  if (f.includes('dvd'))  return 'fmt-dvd';
  return 'fmt-';
}

function formatDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const today = new Date();
  today.setHours(0,0,0,0);
  const diff = Math.round((dt - today) / 86400000);
  let label = '';
  if (diff === 0) label = ' — TODAY';
  else if (diff === 1) label = ' — TOMORROW';
  return `${days[dt.getDay()]}, ${months[m-1]} ${d}, ${y}${label}`;
}

function normalizeTimeForSort(t) {
  if (!t) return '99:99';
  const m = t.match(/(\d{1,2}):(\d{2})\s*([aApP][mM])/);
  if (!m) return t;
  let h = parseInt(m[1]);
  const min = m[2];
  const ampm = m[3].toLowerCase();
  if (ampm === 'pm' && h !== 12) h += 12;
  if (ampm === 'am' && h === 12) h = 0;
  return `${String(h).padStart(2,'0')}:${min}`;
}

// ──────────────────────────────────────────────────────────────
// Render
// ──────────────────────────────────────────────────────────────
function buildVenueFilters() {
  // Only show venues matching the active city filter
  const venues = [...new Set(
    allScreenings
      .filter(s => activeCity === 'all' || s.city === activeCity)
      .map(s => s.venue_short)
  )];
  const container = document.getElementById('venue-filters');
  container.innerHTML = '';
  // Re-seed activeVenues with all venues for the current city
  venues.forEach(v => activeVenues.add(v));
  venues.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'venue-pill' + (activeVenues.has(v) ? ' active' : '');
    btn.dataset.venue = v;
    btn.textContent = v;
    btn.onclick = () => {
      if (activeVenues.has(v)) activeVenues.delete(v);
      else activeVenues.add(v);
      btn.classList.toggle('active', activeVenues.has(v));
      renderScreenings();
    };
    container.appendChild(btn);
  });
}

function cardVisible(s) {
  if (activeCity !== 'all' && s.city !== activeCity) return false;
  if (!activeVenues.has(s.venue_short)) return false;
  if (searchQuery && !s.title.toLowerCase().includes(searchQuery)) return false;
  if (activeFilter === 'want') return s.status === 'want';
  if (activeFilter === 'available') return s.status !== 'dismissed';
  return true;
}

function renderScreenings() {
  const main = document.getElementById('main');

  // Group by date
  const byDate = {};
  allScreenings.forEach(s => {
    if (!cardVisible(s)) return;
    if (!byDate[s.date]) byDate[s.date] = [];
    byDate[s.date].push(s);
  });

  const dates = Object.keys(byDate).sort();

  if (dates.length === 0) {
    main.innerHTML = '<div class="empty-state"><h2>No screenings match your filters.</h2><p>Try adjusting the filters above.</p></div>';
    updateStatusBar();
    return;
  }

  main.innerHTML = '';
  dates.forEach(date => {
    const screenings = byDate[date];
    const section = document.createElement('section');
    section.className = 'date-section';

    const visibleCount = screenings.filter(s => s.status !== 'dismissed').length;
    const wantCount = screenings.filter(s => s.status === 'want').length;
    let countStr = `${visibleCount} screening${visibleCount !== 1 ? 's' : ''}`;
    if (wantCount) countStr += ` · ${wantCount} wanted`;

    section.innerHTML = `
      <div class="date-header">
        ${formatDate(date)}
        <span class="date-count">${countStr}</span>
      </div>
      <div class="screenings-grid" data-date="${date}"></div>
    `;

    const grid = section.querySelector('.screenings-grid');
    screenings
      .slice()
      .sort((a,b) => normalizeTimeForSort(a.time).localeCompare(normalizeTimeForSort(b.time)))
      .forEach(s => {
        if (activeFilter !== 'all' && !cardVisible(s)) return;
        grid.appendChild(buildCard(s));
      });

    main.appendChild(section);
  });

  updateStatusBar();
}

function buildCard(s) {
  const div = document.createElement('div');
  div.className = `card status-${s.status}`;
  div.dataset.venue = s.venue_short;
  div.dataset.id = s.id;

  const fmtHtml = s.format
    ? `<span class="card-format ${fmtClass(s.format)}">${s.format}</span>`
    : '';

  const wantActive = s.status === 'want';
  const dismissActive = s.status === 'dismissed';

  div.innerHTML = `
    <div class="card-title">${escHtml(s.title)}</div>
    <div class="card-meta">
      <span class="card-time">${escHtml(s.time || '—')}</span>
      ${fmtHtml}
    </div>
    <div class="card-venue">${escHtml(s.venue)}</div>
    <div class="card-actions">
      <button class="btn-want" title="${wantActive ? 'Remove from want list' : 'Add to want list'}">
        ${wantActive ? '&#10003; Watching' : '+ Want'}
      </button>
      <button class="btn-dismiss" title="${dismissActive ? 'Restore' : 'Dismiss'}">
        ${dismissActive ? '&#8635; Restore' : '&#10005; Skip'}
      </button>
      ${s.url ? `<a class="btn-ticket" href="${escHtml(s.url)}" target="_blank" rel="noopener">Tickets ↗</a>` : ''}
    </div>
  `;

  div.querySelector('.btn-want').onclick = (e) => {
    e.stopPropagation();
    const newStatus = s.status === 'want' ? 'available' : 'want';
    s.status = newStatus;
    updateStatus(s.id, newStatus);
    renderScreenings();
    renderSchedulePanel();
  };

  div.querySelector('.btn-dismiss').onclick = (e) => {
    e.stopPropagation();
    const newStatus = s.status === 'dismissed' ? 'available' : 'dismissed';
    s.status = newStatus;
    updateStatus(s.id, newStatus);
    renderScreenings();
  };

  return div;
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ──────────────────────────────────────────────────────────────
// Schedule calendar
// ──────────────────────────────────────────────────────────────
let calYear = null;
let calMonth = null; // 0-indexed

const MONTH_NAMES = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];
const VENUE_COLORS = {
  NewBev: '#e05c3a', Vista: '#6b9fc8', Vidiots: '#7ac87a',
  BrainDead: '#b07ae8', Academy: '#e87a9e',
  Aero: '#e8c84a', Egyptian: '#c8874a', LosFeliz: '#4ac8c8', DirsVillage: '#a8c84a',
};

function initCalMonth() {
  const wanted = allScreenings.filter(s => s.status === 'want');
  if (wanted.length === 0) { calYear = null; calMonth = null; return; }
  // Default to the month of the earliest wanted screening
  const earliest = wanted.map(s => s.date).sort()[0];
  const [y, m] = earliest.split('-').map(Number);
  calYear = y;
  calMonth = m - 1;
}

function renderSchedulePanel() {
  const wanted = allScreenings.filter(s => s.status === 'want');
  const grid = document.getElementById('cal-grid');
  const label = document.getElementById('cal-month-label');
  const legend = document.getElementById('schedule-legend');

  if (wanted.length === 0) {
    grid.innerHTML = '<div class="cal-empty-msg" style="grid-column:1/-1">Mark screenings with <strong>+ Want</strong> to build your schedule.</div>';
    label.textContent = '';
    legend.innerHTML = '';
    return;
  }

  if (calYear === null) initCalMonth();

  label.textContent = `${MONTH_NAMES[calMonth]} ${calYear}`;

  // Group wanted by date string
  const byDate = {};
  wanted.forEach(s => {
    if (!byDate[s.date]) byDate[s.date] = [];
    byDate[s.date].push(s);
  });

  // Build calendar grid for calYear/calMonth
  const today = new Date();
  const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  let cells = '';

  // Leading empty cells
  for (let i = 0; i < firstDay; i++) {
    cells += '<div class="cal-cell empty"></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = (today.getFullYear() === calYear && today.getMonth() === calMonth && today.getDate() === d);
    const events = byDate[dateStr] || [];
    const hasConflict = events.length > 1;

    let cls = 'cal-cell';
    if (isToday) cls += ' today';
    if (events.length) cls += ' has-events';

    let inner = `<div class="cal-day-num">${d}</div>`;

    if (hasConflict) {
      inner += `<div class="cal-conflict-note">⚠ ${events.length} screenings</div>`;
    }

    events
      .slice()
      .sort((a,b) => normalizeTimeForSort(a.time).localeCompare(normalizeTimeForSort(b.time)))
      .forEach(s => {
        const fmtStr = s.format ? ` · ${s.format}` : '';
        inner += `
          <div class="cal-event${hasConflict ? ' conflict' : ''}" data-venue="${escHtml(s.venue_short)}">
            <div class="cal-event-title">${escHtml(s.title)}</div>
            <div class="cal-event-meta">${escHtml(s.time)}${fmtStr} · ${escHtml(s.venue_short)}</div>
          </div>`;
      });

    cells += `<div class="${cls}">${inner}</div>`;
  }

  grid.innerHTML = cells;

  // Legend — only venues that appear in wanted
  const venuesUsed = [...new Set(wanted.map(s => s.venue_short))];
  legend.innerHTML = venuesUsed.map(v => `
    <span class="schedule-legend-item">
      <span class="schedule-legend-swatch" style="background:${VENUE_COLORS[v]||'#888'}"></span>
      ${VENUE_COLORS[v] ? `<span>${v}</span>` : v}
    </span>`).join('');
}

// ──────────────────────────────────────────────────────────────
// Status bar
// ──────────────────────────────────────────────────────────────
function updateStatusBar() {
  const total = allScreenings.length;
  const want = allScreenings.filter(s => s.status === 'want').length;
  const dismissed = allScreenings.filter(s => s.status === 'dismissed').length;
  document.getElementById('status-bar').textContent =
    `${total} total · ${want} wanted · ${dismissed} skipped`;
}

// ──────────────────────────────────────────────────────────────
// Init & events
// ──────────────────────────────────────────────────────────────
async function init() {
  showLoading('Loading schedule data…');
  try {
    allScreenings = await fetchScreenings();
    buildVenueFilters();
    renderScreenings();
    renderSchedulePanel();
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="empty-state"><h2>Failed to load data</h2><p>${e.message}</p></div>`;
  } finally {
    hideLoading();
  }
}

function showLoading(msg) {
  document.getElementById('loading-msg').textContent = msg;
  document.getElementById('loading').classList.add('show');
}
function hideLoading() {
  document.getElementById('loading').classList.remove('show');
}

// City filter buttons
document.querySelectorAll('#city-filter .filter-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#city-filter .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCity = btn.dataset.city;
    // Reset venue selection to match new city
    activeVenues.clear();
    buildVenueFilters();
    renderScreenings();
  };
});

// Status filter buttons
document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderScreenings();
  };
});

// Search
document.getElementById('search').addEventListener('input', (e) => {
  searchQuery = e.target.value.toLowerCase().trim();
  renderScreenings();
});

// Refresh
document.getElementById('refresh-btn').onclick = async () => {
  showLoading('Scraping all venues… this takes ~30–60 seconds');
  try {
    const res = await fetch('/api/refresh', {method:'POST'});
    const data = await res.json();
    if (data.ok) {
      allScreenings = await fetchScreenings();
      buildVenueFilters();
      renderScreenings();
      renderSchedulePanel();
    }
  } catch(e) {
    alert('Refresh failed: ' + e.message);
  } finally {
    hideLoading();
  }
};

// Reset
document.getElementById('reset-btn').onclick = async () => {
  if (!confirm('Reset all want/skip status?')) return;
  await fetch('/api/reset_state', {method:'POST'});
  allScreenings.forEach(s => s.status = 'available');
  renderScreenings();
  renderSchedulePanel();
};

// Schedule calendar modal
document.getElementById('schedule-btn').onclick = () => {
  initCalMonth();
  renderSchedulePanel();
  document.getElementById('schedule-modal').classList.add('open');
};
document.getElementById('close-panel').onclick = () => {
  document.getElementById('schedule-modal').classList.remove('open');
};
// Close on backdrop click
document.getElementById('schedule-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('schedule-modal'))
    document.getElementById('schedule-modal').classList.remove('open');
});
document.getElementById('cal-prev').onclick = () => {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderSchedulePanel();
};
document.getElementById('cal-next').onclick = () => {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderSchedulePanel();
};

init();
</script>
</body>
</html>
